; Minimal PJSIP WebRTC endpoint example. Adapt to your PBX.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[1001]
type=endpoint
aors=1001
auth=1001
context=from-internal
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
direct_media=no
force_rport=yes
rewrite_contact=yes

[1001]
type=auth
auth_type=userpass
username=1001
password=CHANGE_ME_STRONG_PASSWORD

[1001]
type=aor
max_contacts=3
remove_existing=yes
